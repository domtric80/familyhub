name: familyhub-semgrep

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "10 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: familyhub-semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep PHP and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.173.0
      - name: Run Semgrep
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          baseline_args=()
          if [[ -n "$BASELINE_COMMIT" ]]; then
            baseline_args+=(--baseline-commit "$BASELINE_COMMIT" --error)
          fi

          semgrep scan \
            backend/app \
            backend/config \
            backend/database \
            backend/routes \
            frontend/src \
            --config p/php \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep.sarif \
            --metrics=off \
            "${baseline_args[@]}"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        if: ${{ always() && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: semgrep.sarif
