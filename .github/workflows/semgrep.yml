name: familyhub-semgrep

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "37 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep PHP and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:latest@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan PHP and TypeScript
        run: >-
          semgrep scan
          --config p/php
          --config p/typescript
          --config p/javascript
          --severity ERROR
          --error
          --sarif
          --output semgrep.sarif
          backend frontend/src
      - name: Upload SARIF
        if: ${{ always() && github.actor != 'dependabot[bot]' && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep-php-typescript
