version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Rome }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    labels: [dependencies, security]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "05:15", timezone: Europe/Rome }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    labels: [dependencies, security]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:30", timezone: Europe/Rome }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    labels: [dependencies, security]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "05:45", timezone: Europe/Rome }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    labels: [dependencies, security]
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Rome }
    open-pull-requests-limit: 5
    cooldown: { default-days: 7 }
    labels: [dependencies, security]
