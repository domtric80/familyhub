openapi: 3.1.0
info:
  title: FamilyHub API
  version: 1.1.1
  summary: API applicative per autenticazione, anagrafiche amministrative e gestione minori.
  description: >
    Specifica iniziale delle API FamilyHub. Ogni modifica funzionale alle route o ai payload
    deve essere riflessa in questo documento prima o insieme all'implementazione.
servers:
  - url: http://localhost:8100/api
    description: Stack locale Docker tramite Nginx
tags:
  - name: Health
  - name: Auth
  - name: Lookups
  - name: Admin
  - name: Minors
  - name: Staff
  - name: Messaging
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      responses:
        '200':
          description: Stato servizio API
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, examples: [ok] }
                  service: { type: string, examples: [familyhub-api] }
                required: [status, service]
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: >
        Richiede un `login_context_token` ottenuto da `GET /auth/login-context`.
        Il token di contesto scade dopo 10 minuti se la pagina login resta inattiva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login riuscito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '419':
          description: Sessione login scaduta prima dell'invio credenziali
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login-context:
    get:
      tags: [Auth]
      operationId: loginContext
      description: >
        Inizializza il contesto della pagina login. Il token restituito va inviato
        nel campo `login_context_token` del login e resta valido 10 minuti.
      responses:
        '200':
          description: Contesto login inizializzato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginContextResponse'
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      operationId: currentUser
      responses:
        '200':
          description: Profilo utente autenticato
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
                required: [user]
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Token non valido, sessione scaduta per inattività > 60 minuti o per durata assoluta 8 ore
  /auth/mfa/status:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      operationId: mfaStatus
      responses:
        '200':
          description: Stato MFA dell’utente autenticato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatusResponse'
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      operationId: logout
      responses:
        '200':
          description: Logout riuscito
  /admin/database-backups:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminListDatabaseBackups
      responses:
        '200':
          description: Lista backup database disponibili
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatabaseBackupItem'
                  restore_confirm_text:
                    type: string
                required: [items, restore_confirm_text]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/database-backups/export:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminExportDatabaseBackup
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, nullable: true }
      responses:
        '201':
          description: Backup creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackupItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/database-backups/download:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminDownloadDatabaseBackup
      parameters:
        - in: query
          name: filename
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Download file SQL
          content:
            application/sql:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/database-backups/restore:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminRestoreDatabaseBackup
      description: >
        Ripristino esplicito del database da backup esistente o da file SQL caricato.
        Il backend crea di default un backup pre-restore prima del ripristino.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DatabaseBackupRestoreRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseBackupRestoreRequest'
      responses:
        '200':
          description: Restore completato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseBackupRestoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/system/storage-configs:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminListSystemStorageConfigs
      responses:
        '200':
          description: Elenco configurazioni storage e sorgente runtime attuale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStorageConfigIndexResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminCreateSystemStorageConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemStorageConfigUpsertRequest'
      responses:
        '201':
          description: Configurazione storage creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStorageConfigSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/system/storage-configs/{storageConfig}:
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminUpdateSystemStorageConfig
      parameters:
        - $ref: '#/components/parameters/SystemStorageConfigId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemStorageConfigUpsertRequest'
      responses:
        '200':
          description: Configurazione storage aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStorageConfigSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminPatchSystemStorageConfig
      parameters:
        - $ref: '#/components/parameters/SystemStorageConfigId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemStorageConfigUpsertRequest'
      responses:
        '200':
          description: Configurazione storage aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStorageConfigSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminDeleteSystemStorageConfig
      parameters:
        - $ref: '#/components/parameters/SystemStorageConfigId'
      responses:
        '200':
          description: Configurazione storage eliminata
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/system/storage-configs/{storageConfig}/test:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminTestSystemStorageConfig
      parameters:
        - $ref: '#/components/parameters/SystemStorageConfigId'
      responses:
        '200':
          description: Esito test connessione storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStorageConfigTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/system/storage-configs/{storageConfig}/activate:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminActivateSystemStorageConfig
      parameters:
        - $ref: '#/components/parameters/SystemStorageConfigId'
      responses:
        '200':
          description: Configurazione storage attivata
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  current_source: { type: string, enum: [ENV, DB] }
                  item:
                    $ref: '#/components/schemas/SystemStorageConfigSummary'
                required: [message, current_source, item]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/system/health:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminSystemHealth
      responses:
        '200':
          description: Snapshot stato servizi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/system/health/run:
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: adminRunSystemHealth
      responses:
        '200':
          description: Snapshot stato servizi dopo esecuzione manuale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/mfa/setup:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      operationId: setupMfa
      responses:
        '200':
          description: MFA inizializzata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
  /auth/mfa/confirm:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      operationId: confirmMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
              required: [code]
      responses:
        '200':
          description: MFA confermata
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/mfa/recovery-codes/regenerate:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      operationId: regenerateMfaRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
              required: [code]
      responses:
        '200':
          description: Recovery codes rigenerate
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  recovery_codes:
                    type: array
                    items: { type: string }
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/mfa/disable:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      operationId: disableMfa
      responses:
        '200':
          description: MFA disattivata
  /lookups/geography:
    get:
      tags: [Lookups]
      operationId: geographyLookup
      responses:
        '200':
          description: Nazioni, regioni, province e città
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
  /lookups/cities:
    get:
      tags: [Lookups]
      operationId: citiesLookup
      parameters:
        - name: province_id
          in: query
          required: false
          schema:
            type: integer
          description: Se valorizzato, restituisce solo le citt? della provincia indicata.
      responses:
        '200':
          description: Elenco città con gerarchia geografica
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
  /lookups/roles:
    get:
      tags: [Lookups]
      operationId: rolesLookup
      responses:
        '200':
          description: Ruoli applicativi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
  /lookups/document-types:
    get:
      tags: [Lookups]
      operationId: documentTypesLookup
      responses:
        '200':
          description: Tipologie documentali
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
  /lookups/document-classifications:
    get:
      tags: [Lookups]
      operationId: documentClassificationsLookup
      responses:
        '200':
          description: Classificazioni documentali supportate dal backend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentClassification'
  /lookups/document-scopes:
    get:
      tags: [Lookups]
      operationId: documentScopesLookup
      responses:
        '200':
          description: Scope documento attivi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentScope'
  /lookups/document-issuers:
    get:
      tags: [Lookups]
      operationId: documentIssuersLookup
      responses:
        '200':
          description: Enti rilascio documento attivi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentIssuer'
  /lookups/contact-types:
    get:
      tags: [Lookups]
      operationId: contactTypesLookup
      responses:
        '200':
          description: Tipologie contatto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
  /lookups/staff-qualifications:
    get:
      tags: [Lookups]
      operationId: staffQualificationsLookup
      responses:
        '200':
          description: Qualifiche operatore attive
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffQualification'
  /lookups/staff-statuses:
    get:
      tags: [Lookups]
      operationId: staffStatusesLookup
      responses:
        '200':
          description: Stati operatore attivi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffStatus'
  /lookups/facility-statuses:
    get:
      tags: [Lookups]
      operationId: facilityStatusesLookup
      responses:
        '200':
          description: Stati struttura attivi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacilityStatus'
  /lookups/staff-document-statuses:
    get:
      tags: [Lookups]
      operationId: staffDocumentStatusesLookup
      responses:
        '200':
          description: Stati documento staff attivi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffDocumentStatus'
  /lookups/minor-statuses:
    get:
      tags: [Lookups]
      operationId: minorStatusesLookup
      responses:
        '200':
          description: Stati anagrafici minore
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
  /lookups/biological-sexes:
    get:
      tags: [Lookups]
      operationId: biologicalSexesLookup
      responses:
        '200':
          description: Anagrafica sesso biologico attiva
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
  /lookups/gender-identities:
    get:
      tags: [Lookups]
      operationId: genderIdentitiesLookup
      responses:
        '200':
          description: Anagrafica genere/identità di genere
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LookupItem'
  /lookups/activity-types:
    get:
      tags: [Lookups]
      operationId: activityTypesLookup
      responses:
        '200':
          description: Tipologie attivita disponibili
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityType'
  /lookups/approach-types:
    get:
      tags: [Lookups]
      operationId: approachTypesLookup
      responses:
        '200':
          description: Tipologie avvicinamento attive
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApproachType'
  /lookups/journal-entry-types:
    get:
      tags: [Lookups]
      operationId: journalEntryTypesLookup
      responses:
        '200':
          description: Tipologie diario minore attive
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntryType'
  /admin/organizations:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: listOrganizations
      responses:
        '200':
          description: Elenco organizzazioni
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationWrite'
      responses:
        '201':
          description: Organizzazione creata
  /admin/facilities:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: listFacilities
      responses:
        '200':
          description: Elenco strutture
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facility'
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: createFacility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '201':
          description: Struttura creata
  /admin/facility-statuses:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: listFacilityStatuses
      responses:
        '200':
          description: Elenco stati struttura
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FacilityStatus'
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: createFacilityStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityStatusWrite'
      responses:
        '201':
          description: Stato struttura creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityStatus'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/facility-statuses/{facility_status}:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: getFacilityStatus
      parameters:
        - $ref: '#/components/parameters/FacilityStatusId'
      responses:
        '200':
          description: Dettaglio stato struttura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityStatus'
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: updateFacilityStatus
      parameters:
        - $ref: '#/components/parameters/FacilityStatusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityStatusWrite'
      responses:
        '200':
          description: Stato struttura aggiornato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityStatus'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: deleteFacilityStatus
      parameters:
        - $ref: '#/components/parameters/FacilityStatusId'
      responses:
        '204':
          description: Stato struttura eliminato
        '409':
          description: Stato struttura in uso
  /admin/facilities/{facility}:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: getFacility
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Dettaglio struttura
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
    put:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: updateFacility
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityWrite'
      responses:
        '200':
          description: Struttura aggiornata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: deleteFacility
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Struttura eliminata
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '409':
          description: Struttura collegata a dati applicativi
  /admin/users:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: listUsers
      responses:
        '200':
          description: Elenco utenti applicativi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserWrite'
      responses:
        '201':
          description: Utente creato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
  /admin/users/linkable-staff-members:
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      operationId: listLinkableStaffMembers
      parameters:
        - in: query
          name: facility_id
          schema: { type: integer }
        - in: query
          name: q
          schema: { type: string }
          description: Ricerca per nome, cognome, email o matricola.
      responses:
        '200':
