[program:familyhub-worker]
command=php /var/www/familyhub/backend/artisan queue:work --tries=3 --timeout=90 --sleep=3
directory=/var/www/familyhub/backend
autostart=true
autorestart=true
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
stdout_logfile=/var/log/familyhub-worker.log
stopwaitsecs=3600

[program:familyhub-scheduler]
command=/bin/sh -lc 'while true; do php /var/www/familyhub/backend/artisan schedule:run --verbose --no-interaction; sleep 60; done'
directory=/var/www/familyhub/backend
autostart=true
autorestart=true
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
redirect_stderr=true
stdout_logfile=/var/log/familyhub-scheduler.log
stopwaitsecs=120
