name: familyhub-prod

services:
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      - frontend
      - app
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge_net
      - app_net
    volumes:
      - ./infra/nginx/familyhub.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - public_storage:/var/www/storage:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_CITY_MAP_PROVIDER: ${VITE_CITY_MAP_PROVIDER:-osm}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
    restart: unless-stopped
    networks:
      - app_net

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-lc", "sh /var/www/html/docker/app/start-app.sh"]
    env_file:
      - ./infra/env/backend.prod.env.example
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      ANTIVIRUS_HOST: clamav
      ANTIVIRUS_PORT: "3310"
      FAMILYHUB_ENSURE_LOCAL_ADMIN_PASSWORD: "false"
    depends_on:
      - postgres
      - redis
      - minio
      - clamav
    networks:
      - app_net
      - data_net
    volumes:
      - public_storage:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-lc", "sh /var/www/html/docker/app/start-worker.sh"]
    env_file:
      - ./infra/env/backend.prod.env.example
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      ANTIVIRUS_HOST: clamav
      ANTIVIRUS_PORT: "3310"
      FAMILYHUB_ENSURE_LOCAL_ADMIN_PASSWORD: "false"
    depends_on:
      - app
    networks:
      - app_net
      - data_net
    volumes:
      - public_storage:/var/www/html/storage/app/public

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-lc", "sh /var/www/html/docker/app/start-scheduler.sh"]
    env_file:
      - ./infra/env/backend.prod.env.example
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      ANTIVIRUS_HOST: clamav
      ANTIVIRUS_PORT: "3310"
      FAMILYHUB_ENSURE_LOCAL_ADMIN_PASSWORD: "false"
    depends_on:
      - app
    networks:
      - app_net
      - data_net
    volumes:
      - public_storage:/var/www/html/storage/app/public

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familyhub}
      POSTGRES_USER: ${POSTGRES_USER:-familyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    expose:
      - "5432"
    networks:
      - data_net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    expose:
      - "6379"
    networks:
      - data_net
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-familyhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    expose:
      - "9000"
      - "9001"
    networks:
      - data_net
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav:stable@sha256:0e85467cb0d6e7d860a45035707741cd5ffc032ffefc6002a3510c75b6d07027
    restart: unless-stopped
    expose:
      - "3310"
    networks:
      - data_net
    volumes:
      - clamav_data:/var/lib/clamav

  mc:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-familyhub} ${MINIO_ROOT_PASSWORD:-change-me-minio}) do echo 'waiting for minio'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/${AWS_BUCKET:-familyhub-private};
      /usr/bin/mc anonymous set none local/${AWS_BUCKET:-familyhub-private};
      exit 0;
      "
    networks:
      - data_net

networks:
  edge_net:
    driver: bridge
  app_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true

volumes:
  public_storage:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
